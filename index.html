<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Image Collate Tool</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    padding: 20px;
  }
  canvas {
    border: 1px solid #ccc;
    margin: 10px 0;
    max-width: 100%;
  }
  .row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  hr {
    margin: 30px 0;
    border: none;
    border-top: 1px solid #ccc;
  }
  button {
    padding: 6px 14px;
    margin: 4px 6px 4px 0;
    cursor: pointer;
  }
  button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }
  #animStatus {
    margin-left: 8px;
    color: #555;
    font-size: 0.9em;
  }
  .controls {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    align-items: center;
    margin: 10px 0;
  }
  .controls input[type="number"] {
    width: 4em;
  }
</style>
</head>
<body>

<h2>Image Collate (JS Canvas)</h2>

<input type="file" id="upload" accept="image/*" /><br><br>

<label>
  Sections:
  <input type="range" id="sections" min="2" max="60" value="20">
  <span id="sectionsVal">20</span>
</label>

<div class="row">
  <div>
    <h3>Original</h3>
    <canvas id="original"></canvas>
  </div>
  <div>
    <h3>Modified</h3>
    <canvas id="output"></canvas><br>
    <button id="download" disabled>Download modified image</button>
  </div>
</div>

<hr>

<h2>Animation</h2>
<p>Sweeps the collage effect across a range of section counts, as a looping
animation you can download.</p>

<div class="controls">
  <label>Start:
    <input type="number" id="animStart" min="2" max="60" value="2">
  </label>
  <label>End:
    <input type="number" id="animEnd" min="2" max="60" value="60">
  </label>
  <label>Order:
    <select id="animOrder">
      <option value="forward">Forward</option>
      <option value="reverse">Reverse</option>
    </select>
  </label>
</div>

<button id="genAnim" disabled>Generate animation</button>
<span id="animStatus"></span>

<div class="row">
  <div>
    <h3>Preview</h3>
    <canvas id="animPreview"></canvas>
  </div>
</div>

<div>
  <button id="downloadGif" disabled>Download GIF</button>
  <button id="downloadVideo" disabled>Download video</button>
</div>

<script src="vendor/gif.js"></script>
<script>
const upload = document.getElementById("upload");
const sectionsSlider = document.getElementById("sections");
const sectionsVal = document.getElementById("sectionsVal");

const originalCanvas = document.getElementById("original");
const outputCanvas = document.getElementById("output");
const downloadBtn = document.getElementById("download");

const genAnimBtn = document.getElementById("genAnim");
const animStatus = document.getElementById("animStatus");
const animPreview = document.getElementById("animPreview");
const downloadGifBtn = document.getElementById("downloadGif");
const downloadVideoBtn = document.getElementById("downloadVideo");
const animStart = document.getElementById("animStart");
const animEnd = document.getElementById("animEnd");
const animOrder = document.getElementById("animOrder");

let sourceImage = null;
let sourceName = "collage";

// Animation state
const FRAME_MAX_SIDE = 480;   // max long side of each animation frame (px)
const FRAME_DELAY = 70;       // ms per frame
let animFrames = [];          // rendered frame canvases
let animTimer = null;         // preview playback timer
let gifUrl = null;            // last generated GIF object URL
let videoUrl = null;          // last generated video object URL

sectionsSlider.oninput = () => {
  sectionsVal.textContent = sectionsSlider.value;
  if (sourceImage) processImage();
};

upload.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  sourceName = file.name.replace(/\.[^.]+$/, "") || "collage";

  const img = new Image();
  img.onload = () => {
    sourceImage = img;
    drawOriginal(img);
    processImage();
    genAnimBtn.disabled = false;
    resetAnimation();
  };
  img.src = URL.createObjectURL(file);
};

function drawOriginal(img) {
  originalCanvas.width = img.width;
  originalCanvas.height = img.height;
  const ctx = originalCanvas.getContext("2d");
  ctx.drawImage(img, 0, 0);
}

function processImage() {
  const sections = parseInt(sectionsSlider.value);
  const mosaic = createMosaic(sourceImage);
  const vc = sliceAndReorder(mosaic, sections, "v");
  const vc2 = sliceAndReorder(vc, sections, "h");

  outputCanvas.width = vc2.width;
  outputCanvas.height = vc2.height;
  outputCanvas.getContext("2d").drawImage(vc2, 0, 0);

  downloadBtn.disabled = false;
}

downloadBtn.onclick = () => {
  outputCanvas.toBlob((blob) => {
    if (!blob) return;
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = sourceName + "_collage.png";
    link.click();
    URL.revokeObjectURL(link.href);
  }, "image/png");
};

/* ---------- Equivalent of the PIL mosaic ---------- */
function createMosaic(img) {
  const w = img.width;
  const h = img.height;
  const canvas = document.createElement("canvas");
  canvas.width = w * 2;
  canvas.height = h * 2;
  const ctx = canvas.getContext("2d");

  // original
  ctx.drawImage(img, 0, 0);

  // horizontal flip
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(img, -2 * w, 0);
  ctx.restore();

  // vertical flip
  ctx.save();
  ctx.scale(1, -1);
  ctx.drawImage(img, 0, -2 * h);
  ctx.restore();

  // horizontal + vertical
  ctx.save();
  ctx.scale(-1, -1);
  ctx.drawImage(img, -2 * w, -2 * h);
  ctx.restore();

  return canvas;
}

/* ---------- Equivalent of img_sect + reorder ---------- */
function sliceAndReorder(canvas, sections, orientation) {
  const w = canvas.width;
  const h = canvas.height;
  const ctx = canvas.getContext("2d");

  const slices = [];
  if (orientation === "v") {
    const sw = Math.floor(w / sections);
    for (let i = 0; i < sections; i++) {
      const cw = i === sections - 1 ? w - sw * i : sw;
      slices.push(getSlice(ctx, i * sw, 0, cw, h));
    }
  } else {
    const sh = Math.floor(h / sections);
    for (let i = 0; i < sections; i++) {
      const ch = i === sections - 1 ? h - sh * i : sh;
      slices.push(getSlice(ctx, 0, i * sh, w, ch));
    }
  }

  const out = document.createElement("canvas");
  out.width = w;
  out.height = h;
  const octx = out.getContext("2d");

  for (let i = 0; i < Math.floor(sections / 2); i++) {
    const a = slices[i];
    const b = slices[sections - 1 - i];

    if (orientation === "v") {
      octx.drawImage(a, a.width * (i * 2), 0);
      octx.drawImage(b, a.width * (2 * i + 1), 0);
    } else {
      octx.drawImage(a, 0, a.height * (i * 2));
      octx.drawImage(b, 0, a.height * (2 * i + 1));
    }
  }

  return out;
}

function getSlice(ctx, x, y, w, h) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  c.getContext("2d").drawImage(
    ctx.canvas,
    x, y, w, h,
    0, 0, w, h
  );
  return c;
}

/* ---------- Animation: sweep sections from min to max ---------- */

function resetAnimation() {
  stopPreview();
  animFrames = [];
  if (gifUrl) { URL.revokeObjectURL(gifUrl); gifUrl = null; }
  if (videoUrl) { URL.revokeObjectURL(videoUrl); videoUrl = null; }
  downloadGifBtn.disabled = true;
  downloadVideoBtn.disabled = true;
  animStatus.textContent = "";
  animPreview.getContext("2d").clearRect(0, 0, animPreview.width, animPreview.height);
}

// Downscale the source so each collage frame's long side is <= FRAME_MAX_SIDE
// (the collage output is twice the source dimensions). Keeps rendering and the
// resulting GIF/video fast and light.
function scaledSourceCanvas(img, maxSide) {
  const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  return c;
}

function renderCollageFrame(scaled, sections) {
  const mosaic = createMosaic(scaled);
  const vc = sliceAndReorder(mosaic, sections, "v");
  return sliceAndReorder(vc, sections, "h");
}

// Clamp a section count to the slider's allowed range.
function clampSections(v) {
  const min = parseInt(sectionsSlider.min);
  const max = parseInt(sectionsSlider.max);
  if (isNaN(v)) return min;
  return Math.max(min, Math.min(max, v));
}

function buildAnimFrames() {
  const scaled = scaledSourceCanvas(sourceImage, FRAME_MAX_SIDE / 2);

  const start = clampSections(parseInt(animStart.value));
  const end = clampSections(parseInt(animEnd.value));
  const step = 2; // step of 2 keeps every frame's parity (avoids flicker)

  // Sweep from start to end, keeping start's parity.
  const values = [];
  if (start <= end) {
    for (let s = start; s <= end; s += step) values.push(s);
  } else {
    for (let s = start; s >= end; s -= step) values.push(s);
  }
  if (!values.length) values.push(start);

  // Frame order: forward (as swept) or reversed.
  if (animOrder.value === "reverse") values.reverse();

  return values.map((s) => renderCollageFrame(scaled, s));
}

function startPreview() {
  stopPreview();
  if (!animFrames.length) return;
  animPreview.width = animFrames[0].width;
  animPreview.height = animFrames[0].height;
  const ctx = animPreview.getContext("2d");
  let i = 0;
  const draw = () => {
    ctx.drawImage(animFrames[i], 0, 0);
    i = (i + 1) % animFrames.length;
  };
  draw();
  animTimer = setInterval(draw, FRAME_DELAY);
}

function stopPreview() {
  if (animTimer) {
    clearInterval(animTimer);
    animTimer = null;
  }
}

genAnimBtn.onclick = () => {
  if (!sourceImage) return;
  genAnimBtn.disabled = true;
  downloadGifBtn.disabled = true;
  downloadVideoBtn.disabled = true;
  animStatus.textContent = "Rendering frames…";

  // Defer so the status text paints before the heavy synchronous work.
  setTimeout(() => {
    resetAnimation();
    animFrames = buildAnimFrames();
    startPreview();
    animStatus.textContent = animFrames.length + " frames ready";
    downloadGifBtn.disabled = false;
    downloadVideoBtn.disabled = false;
    genAnimBtn.disabled = false;
  }, 30);
};

// Changing the range or order invalidates any already-generated animation.
[animStart, animEnd, animOrder].forEach((el) => {
  el.addEventListener("change", () => {
    if (animFrames.length) {
      resetAnimation();
      animStatus.textContent = "Settings changed — click Generate";
    }
  });
});

function triggerDownload(url, name) {
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
}

/* ---------- Download as animated GIF (gif.js) ---------- */
downloadGifBtn.onclick = () => {
  if (!animFrames.length || typeof GIF === "undefined") return;
  downloadGifBtn.disabled = true;
  downloadVideoBtn.disabled = true;
  animStatus.textContent = "Encoding GIF… 0%";

  const gif = new GIF({
    workers: 2,
    quality: 10,
    workerScript: "vendor/gif.worker.js",
    width: animFrames[0].width,
    height: animFrames[0].height,
  });

  animFrames.forEach((frame) => {
    gif.addFrame(frame, { delay: FRAME_DELAY, copy: true });
  });

  gif.on("progress", (p) => {
    animStatus.textContent = "Encoding GIF… " + Math.round(p * 100) + "%";
  });

  gif.on("finished", (blob) => {
    if (gifUrl) URL.revokeObjectURL(gifUrl);
    gifUrl = URL.createObjectURL(blob);
    triggerDownload(gifUrl, sourceName + "_animation.gif");
    animStatus.textContent = "GIF ready";
    downloadGifBtn.disabled = false;
    downloadVideoBtn.disabled = false;
  });

  gif.render();
};

/* ---------- Download as video (MediaRecorder) ---------- */
function pickVideoMime() {
  const types = [
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm",
    "video/mp4",
  ];
  for (const t of types) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) {
      return t;
    }
  }
  return "";
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

downloadVideoBtn.onclick = async () => {
  if (!animFrames.length) return;
  if (typeof MediaRecorder === "undefined") {
    animStatus.textContent = "Video recording is not supported in this browser";
    return;
  }

  downloadGifBtn.disabled = true;
  downloadVideoBtn.disabled = true;
  animStatus.textContent = "Recording video…";
  stopPreview();

  const rec = document.createElement("canvas");
  rec.width = animFrames[0].width;
  rec.height = animFrames[0].height;
  const rctx = rec.getContext("2d");

  const fps = Math.round(1000 / FRAME_DELAY);
  const stream = rec.captureStream(fps);
  const mime = pickVideoMime();
  const chunks = [];
  const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);

  recorder.ondataavailable = (e) => {
    if (e.data && e.data.size) chunks.push(e.data);
  };

  recorder.onstop = () => {
    const type = mime || "video/webm";
    const blob = new Blob(chunks, { type });
    if (videoUrl) URL.revokeObjectURL(videoUrl);
    videoUrl = URL.createObjectURL(blob);
    const ext = type.indexOf("mp4") >= 0 ? "mp4" : "webm";
    triggerDownload(videoUrl, sourceName + "_animation." + ext);
    animStatus.textContent = "Video ready";
    downloadGifBtn.disabled = false;
    downloadVideoBtn.disabled = false;
    startPreview();
  };

  // Draw the first frame before starting so the clip doesn't open on a blank canvas.
  rctx.drawImage(animFrames[0], 0, 0);
  recorder.start();

  // Play two full loops into the recording canvas, then stop.
  for (let loop = 0; loop < 2; loop++) {
    for (let i = 0; i < animFrames.length; i++) {
      rctx.drawImage(animFrames[i], 0, 0);
      await sleep(FRAME_DELAY);
    }
  }

  recorder.stop();
};
</script>

</body>
</html>
